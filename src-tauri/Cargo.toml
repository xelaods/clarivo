[package]
name = "clarivo"
description = "Clarivo — AI noise cancelling, per-app EQ and mixer for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "clarivo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clarivo-engine = { path = "../crates/engine" }
clarivo-dsp = { path = "../crates/dsp" }
clarivo-denoise = { path = "../crates/denoise" }
clarivo-routing = { path = "../crates/routing" }
clarivo-speaker = { path = "../crates/speaker" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
rtrb = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
base64 = "0.22"
urlencoding = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
