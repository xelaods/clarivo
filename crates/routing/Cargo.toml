[package]
name = "clarivo-routing"
description = "Per-app audio routing (Game / Chat) and default device control for Clarivo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clarivo-engine = { path = "../engine", default-features = false }
serde = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
