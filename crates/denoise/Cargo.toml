[package]
name = "clarivo-denoise"
description = "RNNoise / DeepFilterNet3 wrappers for Clarivo"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["deepfilter"]
# DeepFilterNet3（高品質モード）。無効にすると RNNoise のみでビルドできる
deepfilter = ["dep:deep_filter", "dep:ndarray", "dep:tract-core", "dep:tract-onnx", "dep:tract-pulse", "dep:tract-hir", "dep:tract-data", "dep:tract-linalg", "dep:tract-nnef", "dep:tract-onnx-opl", "dep:tract-pulse-opl"]

[dependencies]
serde = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
nnnoiseless = { version = "0.5", default-features = false }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray = { version = "0.15", optional = true }
# DeepFilterNet は tract 0.21.4 に合わせて書かれているため固定する（0.21.5 以降で API が変わった）
tract-core = { version = "=0.21.4", optional = true }
tract-onnx = { version = "=0.21.4", optional = true }
tract-pulse = { version = "=0.21.4", optional = true }
tract-hir = { version = "=0.21.4", optional = true }
tract-data = { version = "=0.21.4", optional = true }
tract-linalg = { version = "=0.21.4", optional = true }
tract-nnef = { version = "=0.21.4", optional = true }
tract-onnx-opl = { version = "=0.21.4", optional = true }
tract-pulse-opl = { version = "=0.21.4", optional = true }
