[workspace]
resolver = "2"
members = [
    "crates/dsp",
    "crates/denoise",
    "crates/engine",
]
default-members = [
    "crates/dsp",
    "crates/denoise",
    "crates/engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["xelaods"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
anyhow = "1"
rtrb = "0.3"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

# DeepFilterNet's neural net is too slow without optimisation, even in debug builds.
[profile.dev.package."*"]
opt-level = 3
